<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>kecap Upload Method - WEB KECAP V9/title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <div class="page-noise" aria-hidden="true"></div>

  <main class="page-shell">
    <section class="studio-layout" aria-label="kecap Upload Method">
      <aside class="intro-panel">
        <div class="topline">
          <span class="status-dot"></span>
          <span>Web Version</span>
        </div>

        <div class="brand-mark">
          <img class="brand-logo" src="assets/logo.png" alt="kecap Upload Method logo" />
          <div>
            <p class="eyebrow">Creative Media Toolkit</p>
            <h1>kecap Method</h1>
          </div>
        </div>

        <p class="hero-copy">
          Ini adalah sebuah website yang dimana tujuannya adalah mengubah atau memformat ulang video yang kalian upload di website ini, supaya apasih videonya perlu di format ulang tujuannya adalah ketika kalian mengupload video di tiktok tidak terkompress.
        </p>

        <div class="feature-list" aria-label="Fitur utama">
          <div class="feature-item">
            <span>01</span>
            <p>Validasi resolusi otomatis sebelum proses dimulai.</p>
          </div>
          <div class="feature-item">
            <span>02</span>
            <p>Resolusi tetap dibatasi maksimal 1080p supaya aman diproses.</p>
          </div>
          <div class="feature-item">
            <span>03</span>
            <p>Output MP4 langsung diunduh dengan tambahan paket 8-byte.</p>
          </div>
        </div>

        <p class="credit">Credit / method: @loweilw @.ojeeh29</p>
      </aside>

      <section class="workspace-card">
        <div class="panel-topbar">
          <div>
            <span class="chip">TIKTOK : @loweilw @.ojeeh29</span>
            <h2>Upload Your Video</h2>
          </div>
          <button id="closeBtn" type="button" aria-label="Info close">×</button>
        </div>

        <div class="hero-strip">
          <div>
            <span class="hero-label">Patch Ready</span>
            <strong>Fast MP4 Calibration </strong>
          </div>
          <span class="hero-note">Max 1080p</span>
        </div>

        <input type="file" id="fileInput" accept=".mp4,.mov,.m4v" />

        <button id="selectBtn" type="button" class="upload-box">
          <span class="upload-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img" aria-label="Upload icon">
              <path d="M12 16V5m0 0 4.5 4.5M12 5 7.5 9.5" />
              <path d="M5 15.5v1.25A2.25 2.25 0 0 0 7.25 19h9.5A2.25 2.25 0 0 0 19 16.75V15.5" />
            </svg>
          </span>
          <span class="upload-copy">
            <span class="upload-title">Drop your video here or click to browse</span>
            <span class="upload-subtitle">MP4, MOV, M4V  Max 1080p</span>
            <span id="fileName">Belum ada file dipilih</span>
          </span>
        </button>

        <div class="info-grid" aria-label="Informasi video">
          <div class="info-card">
            <span class="info-label">Resolution</span>
            <div class="info-value" id="resolutionValue">---</div>
          </div>

          <div class="info-card">
            <span class="info-label">FPS</span>
            <div class="info-value" id="fpsValue">---</div>
          </div>

          <div class="info-card">
            <span class="info-label">Bitrate</span>
            <div class="info-value" id="bitrateValue">---</div>
          </div>

          <div class="info-card">
            <span class="info-label">Size</span>
            <div class="info-value" id="sizeValue">---</div>
          </div>
        </div>

        <div class="terminal-card">
          <div class="terminal-head">
            <span>Activity Log</span>
            <span class="terminal-leds" aria-hidden="true">
              <i></i><i></i><i></i>
            </span>
          </div>
          <div id="status">[kecap manis] &gt; Sistem standby...
[ojeeh] &gt; Menunggu file video...</div>
        </div>

        <button id="patchBtn" type="button" disabled>
          Initialize 
        </button>
      </section>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
